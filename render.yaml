services:
  - type: web
    name: rice-leaf-disease-detection
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app -c gunicorn.conf.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TORCH_THREADS
        value: "2"
    plan: free
